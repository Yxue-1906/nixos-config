name: auto-merge-common-config.yml
on:
  push:
    branches: [ common ]

jobs:
  merge-common-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run script
        run: bash .github/merge-common-and-push.sh 2>&1 > bash-log.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          path: bash-log.log
